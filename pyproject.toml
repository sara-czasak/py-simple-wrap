[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py_simple_wrap"
version = "0.9.0"
authors = [
  { name = "Sara Czasak", email = "sara.p.czasak.m@gmail.com" },
]
maintainers = [
  { name = "Sara Czasak", email = "sara.p.czasak.m@gmail.com" },
]
description = "A package to make complex python functionality simple"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["python", "beginner-friendly", "wrapper", "education", "utilities", "helper-functions", "simple-api", "easy-to-use", "automation", "beginner", "learning", "students"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = []
license = "MIT"
license-files = ["LICENSE.md"]
[project.urls]
Homepage = "https://github.com/sara-czasak/py-simple-wrap"
Repository = "https://github.com/sara-czasak/py-simple-wrap"
"Bug Tracker" = "https://github.com/sara-czasak/py-simple-wrap/issues"
Documentation = "https://sara-czasak.github.io/py-simple-wrap/docs/"
Quickstart = "https://github.com/sara-czasak/py-simple-wrap/blob/main/QUICKSTART.md"

[project.optional-dependencies]
base = []
ai = [
    "pydantic>=2.0.0",
    "certifi>=2026.10.19",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-mistralai>=0.1.0",
]
game = [
    "pygame-ce>=2.5.0",
]
viz = [
    "matplotlib>=3.0.0",
]
images = [
    "Pillow>=13.0.0",
    "qrcode>=7.4.0",
]
web = [
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "certifi>=2026.10.19",
]
config = [
    "GitPython>=3.1.0",
]
json = [
    "python-benedict>=0.38.0",
]
terminal = [
    "rich>=13.0.0",
]
all = [
    "py_simple_wrap[ai,game,viz,images,web,config,json,terminal]",
]
test = [
    "pytest>=7.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-include-markdown-plugin",
    "mkdocstrings",
    "mkdocstrings-python",
]

[tool.setuptools.packages.find]
where = ["py_simple_package/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",

]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["docs/*.md", "config_templates/*.yml", "config_templates/*.txt"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F403", "F405", "F401", "E721"]