name: Deploy Pages (Docs + Quest)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --all-extras

      - name: Build docs
        run: uv run mkdocs build -d site-build/docs

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install quest generator dependencies
        run: npm install

      - name: Generate quest site under /quest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx contributor-quest generate --out site-build/quest

      - name: Add Module Book
        run: cp -r module-book site-build/modules

      - name: Add landing page
        run: cp landing/index.html site-build/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
